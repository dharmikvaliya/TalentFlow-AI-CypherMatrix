services:
  - type: web
    name: talentflow-cyphermatrix-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LLM_MOCK
        value: "true"
      - key: LLM_ALLOW_MOCK_FALLBACK
        value: "false"
      - key: MAX_RUNS_PER_DAY
        value: "50"
      - key: MONGODB_DB_NAME
        value: talentflow_cyphermatrix
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
